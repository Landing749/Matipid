name = "matipid-export"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# One free-tier Worker. Deploys to https://matipid-export.<your-subdomain>.workers.dev
# Run `npx wrangler deploy` from this folder to publish, then copy the printed
# URL into src/lib/worker.ts (WORKER_URL) in the main app.

[vars]
# RTDB base URL — public REST endpoint, no service account needed.
FIREBASE_DB_URL = "https://section-matipid-default-rtdb.firebaseio.com"
SECTION_NAME = "MATIPID"

# Repo the /trigger-deploy endpoint dispatches a rebuild to. GITHUB_TOKEN
# itself is NOT here — it's a secret, set separately (never commit it):
#   npx wrangler secret put GITHUB_TOKEN
# Use a fine-grained PAT scoped to just this repo with "Contents: read" +
# "Actions: write" (Actions:write is what lets it fire repository_dispatch
# and see workflow runs — it can't push code or change settings).
GITHUB_OWNER = "Landing749"
GITHUB_REPO = "Matipid"

# Comma-separated list of allowed CORS origins. Add your GitHub Pages URL
# (and http://localhost:5173 for local dev) after deploying.
ALLOWED_ORIGINS = "http://localhost:5173,https://your-username.github.io"

# Section Report extras (photo of the year + signature page) read live
# from the RTDB, not from this file, so they can be changed without a
# redeploy:
#   settings/photoOfTheYear     { imageUrl, caption?, credit? }
#   settings/reportSignatories  { auditorName?, treasurerName?, adviserName? }
# Either node can be partial or missing entirely — the photo page is
# skipped if there's no imageUrl, and any blank signatory name just means
# that officer signs the printed report by hand.

# One Durable Object instance per scheduled announcement, holding a single
# alarm for its publishAt time — fires the rebuild the moment a scheduled
# post actually goes live, with no polling. Free-plan eligible (SQLite
# storage backend). See worker/src/publishScheduler.ts.
[[durable_objects.bindings]]
name = "PUBLISH_SCHEDULER"
class_name = "PublishScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PublishScheduler"]

# Real headless Chrome, used to render the Section Report as styled HTML
# and print it to PDF (replaces the old hand-drawn pdf-lib layout). Free
# plan: 10 minutes of browser usage/day, 60s per session — plenty for
# occasional officer exports. No dashboard setup needed, just this binding.
[browser]
binding = "BROWSER"
